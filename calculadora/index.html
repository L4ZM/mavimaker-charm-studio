<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaviMaker Calculadora</title><style>body{font-family:system-ui;background:#f5f5f5;color:#161616;margin:0;padding:20px}main{max-width:440px;margin:auto}section{background:white;padding:20px;border-radius:18px}h1{margin-bottom:0}p{color:#666;margin-top:4px}label{display:block;font-size:14px;font-weight:600;margin-top:12px}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dark{background:#171717;color:white;padding:18px;margin-top:18px;border-radius:14px}.dark div{display:flex;justify-content:space-between;padding:5px 0}.dark h2{font-size:35px;margin:8px 0}details{margin-top:20px}summary{font-weight:bold;cursor:pointer}button{width:100%;padding:13px;margin-top:14px;border:1px solid #ddd;background:white;border-radius:10px;font-weight:bold}</style><main><h1>MaviMaker</h1><p>Calculadora rápida de impresión 3D</p><section><div class="grid"><div><label>Filamento ($/kg)</label><input id="kg" type="number" value="320"></div><div><label>Material (g)</label><input id="g" type="number" value="25"></div><div><label>Horas</label><input id="h" type="number" step=".25" value="1.25"></div><div><label>Cantidad</label><input id="q" type="number" value="1"></div></div><label>Tipo de venta</label><select id="type"><option value="public">Público</option><option value="bulk">Mayoreo</option><option value="premium">Premium</option></select><div class="dark"><small>Precio sugerido por pieza</small><h2 id="price">—</h2><div><span>Costo estimado</span><b id="cost">—</b></div><div><span>Utilidad por pieza</span><b id="profit">—</b></div><div><span>Margen</span><b id="margin">—</b></div><hr><div><span>Total pedido</span><b id="total">—</b></div></div><details><summary>Ajustar costos</summary><div class="grid"><div><label>Electricidad $/h</label><input id="power" type="number" value=".3"></div><div><label>Desgaste $/h</label><input id="wear" type="number" value="3"></div><div><label>Mano de obra $</label><input id="labor" type="number" value="5"></div><div><label>Extras $</label><input id="extra" type="number" value="0"></div><div><label>Merma %</label><input id="waste" type="number" value="10"></div><div><label>Margen mínimo %</label><input id="minimum" type="number" value="35"></div></div></details><button id="copy" type="button">Copiar cotización</button></section></main><script>(function(){var fields=['kg','g','h','q','type','power','wear','labor','extra','waste','minimum'];function e(id){return document.getElementById(id)}function n(id){return Math.max(0,Number(e(id).value)||0)}function money(v){return '$'+v.toFixed(2)}function calc(){var q=Math.max(1,Math.floor(n('q'))),c=n('kg')*n('g')/1000*(1+n('waste')/100)+n('h')*(n('power')+n('wear'))+n('labor')+n('extra'),base=c/(e('type').value==='premium'?.20:.28),discount=q>=100?.3:q>=30?.23:q>=10?.15:0,minimum=Math.min(.95,n('minimum')/100),p=Math.ceil(Math.max(e('type').value==='bulk'?base*(1-discount):base,c/(1-minimum)));e('price').textContent=money(p);e('cost').textContent=money(c);e('profit').textContent=money(p-c);e('margin').textContent=(p?(p-c)/p*100:0).toFixed(1)+'%';e('total').textContent=money(p*q);return 'MaviMaker\\nPiezas: '+q+'\\nPrecio: '+money(p)+'\\nTotal: '+money(p*q)}fields.forEach(function(f){e(f).addEventListener('input',calc);e(f).addEventListener('change',calc)});e('copy').onclick=function(){var t=calc();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){prompt('Copiar:',t)})}else prompt('Copiar:',t)};calc()})();</script></html>
